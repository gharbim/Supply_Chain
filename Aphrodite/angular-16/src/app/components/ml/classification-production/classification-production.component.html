<div class="container mt-5">
  <h2 class="text-center text-primary">📊 Classification Production</h2>

  <div class="row justify-content-center my-4">
    <div class="col-md-6">
      <label>Dosage :</label>
      <input
        type="number"
        [(ngModel)]="dosage"
        class="form-control"
        placeholder="Entrer le dosage"
        min="0.1"
        max="9"
        step="0.1"
      />
    </div>
  </div>

  <div class="text-center">
    <button class="btn btn-success" (click)="getPrediction()">🔍 Classifier</button>
  </div>

  <div class="text-center mt-4" *ngIf="predictionResult">
    <h4 class="text-success">Résultat : {{ predictionResult }}</h4>
  </div>

  <div class="text-center mt-3 text-danger" *ngIf="errorMessage">
    <strong>{{ errorMessage }}</strong>
  </div>
</div>
