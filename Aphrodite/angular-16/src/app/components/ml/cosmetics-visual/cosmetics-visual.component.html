<div class="card p-4">
    <h4 class="mb-3 text-primary">🎯 Prédiction Catégorie Cosmétique</h4>
  
    <div class="mb-3">
      <input type="file" class="form-control" (change)="onFileSelected($event)" />
    </div>
  
    <div *ngIf="previewUrl" class="mb-3 text-center">
      <img [src]="previewUrl" alt="Prévisualisation" class="img-thumbnail" width="200" />
    </div>
  
    <button class="btn btn-primary" (click)="onSubmit()" [disabled]="!selectedFile">Prédire</button>
  
    <div *ngIf="predictionResult" class="alert alert-info mt-3">
      Catégorie prédite : <strong>{{ predictionResult }}</strong>
    </div>
  </div>
