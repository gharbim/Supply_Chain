<div class="card">
    <div class="card-header">
      🧪 Classification de Stock
    </div>
    <div class="card-body">
      <input type="number" [(ngModel)]="capacity" class="form-control mb-3" placeholder="Enter capacity">
      <button class="btn btn-primary" (click)="classifyStock()">Classifier</button>
  
      <div *ngIf="prediction" class="mt-4">
        <h5>Résultat :</h5>
        <p><strong>{{ prediction }}</strong></p>
        <p>{{ message }}</p>
      </div>
    </div>
  </div>
