<div class="card">
    <div class="card-header">📉 Analyse de Stock (Clustering)</div>
    <div class="card-body">
      <input type="number" [(ngModel)]="capacity" placeholder="Capacité totale" class="form-control mb-2" />
      <input type="number" [(ngModel)]="quantity" placeholder="Quantité actuelle" class="form-control mb-3" />
      <button class="btn btn-primary" (click)="sendRequest()">Analyser</button>
  
      <div *ngIf="interpretation" class="mt-3">
        <p><strong>Interprétation :</strong> {{ interpretation }}</p>
        <p *ngIf="pourcentage !== null"><strong>Remplissage :</strong> {{ pourcentage }}%</p>
      </div>
    </div>
  </div>
