<div class="container mt-5">
    <h2 class="text-center text-info">
      <i class="bi bi-bar-chart-line-fill"></i> Prévision Temporelle ARIMA
    </h2>
  
    <!-- Formulaire -->
    <div class="row my-4 justify-content-center">
      <div class="col-md-4 mb-2">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Date de départ de la prévision</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            [min]="minDate"
            [(ngModel)]="startDate"
            readonly
          />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker
            #picker
            startView="multi-year"
            (monthSelected)="chosenMonthHandler($event, picker)"
            panelClass="month-picker"
            [startAt]="minDate"
            [startView]="'year'"
          ></mat-datepicker>
        </mat-form-field>
      </div>
  
      <div class="col-md-4 mb-2">
        <label class="form-label">
          <i class="bi bi-sliders"></i> Nombre de mois à prédire :
        </label>
        <input type="range" [(ngModel)]="nMonths" min="1" max="12" class="form-range" />
        <span class="badge bg-secondary">{{ nMonths }}</span>
      </div>
  
      <div class="col-md-4 d-flex align-items-end justify-content-center gap-2">
        <button class="btn btn-primary" (click)="getForecast()">Lancer la prévision</button>
        <button class="btn btn-success" (click)="downloadCSV()">📥 Télécharger le CSV</button>
      </div>
    </div>
  
    <!-- Image du graphique -->
    <div *ngIf="plotUrl">
      <img [src]="plotUrl" class="img-fluid border border-info rounded mb-4" />
    </div>
  
    <!-- Tableau -->
    <div *ngIf="forecastTable.length > 0">
      <h4>📋 Détails des prévisions :</h4>
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Date</th>
            <th>Prévision</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of forecastTable">
            <td>{{ row.Date }}</td>
            <td>{{ row.Prediction }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
