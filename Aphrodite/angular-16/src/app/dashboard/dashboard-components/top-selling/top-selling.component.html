<!-- top-selling.component.html -->

<!-- Embedded styles -->
<style>
  .team-card {
    border: none;
    border-radius: 0.5rem;
    overflow: hidden;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .team-card .card-header {
    background-color: #F0C7B6;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 1rem 1.5rem;
  }
  .team-card .card-header h4 {
    margin: 0;
    font-weight: 600;
  }
  .team-card .card-header small {
    opacity: 0.8;
  }

  .team-card .card-body {
    background-color: #f8f9fa;
    padding: 1rem 1.5rem;
  }

  .team-card table {
    width: 100%;
    border-collapse: collapse;
  }
  .team-card thead th {
    border-bottom: 2px solid #dee2e6;
    padding: 0.75rem;
    color: #495057;
    font-weight: 500;
    text-align: left;
  }
  .team-card tbody td {
    padding: 0.75rem;
    vertical-align: middle;
    color: #343a40;
  }

  .team-card tbody tr:hover {
    background-color: rgba(0,0,0,0.03);
  }

  .team-card .avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid #dee2e6;
    object-fit: cover;
  }

  .team-card .badge-role {
    background-color: #6c757d;
    color: #fff;
    padding: 0.35em 0.65em;
    font-size: 0.85rem;
    border-radius: 0.25rem;
  }

  .team-card a.email-link {
    color: #0d6efd;
    text-decoration: none;
  }
  .team-card a.email-link:hover {
    text-decoration: underline;
  }
</style>

<!-- TEAM MEMBERS TABLE -->
<div class="card team-card" style="margin-top: 2rem;">
  <div class="card-header">
    <h4>Our Team</h4>
    <small>Meet the Aphrodite Leadership</small>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table class="table-borderless align-middle">
        <thead>
          <tr>
            <th>Photo</th>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let m of teamMembers">
            <td>
              <img
                [src]="m.image"
                alt="{{ m.name }}"
                class="avatar"
              />
            </td>
            <td>
              <strong>{{ m.name }}</strong>
            </td>
            <td>
              <span class="badge-role">{{ m.role }}</span>
            </td>
            <td>
              <a
                [href]="'mailto:' + m.email"
                class="email-link"
              >
                {{ m.email }}
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
