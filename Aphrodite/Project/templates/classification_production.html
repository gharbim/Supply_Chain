{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">🏭 Classification de quantité utilisé</h2>

    <form method="POST" action="/classification_production" class="card p-5 shadow-lg rounded-4 bg-light">
        <div class="mb-4">
            <label for="dosage" class="form-label">Dosage</label>
            <input type="number" class="form-control" id="dosage" name="dosage"
                   placeholder="⚖️ Entrez le Dosage" required min="0.01" step="any">
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg shadow-sm">
                🔎 Prédire la catégorie
            </button>
        </div>
    </form>
</div>
{% endblock %}
