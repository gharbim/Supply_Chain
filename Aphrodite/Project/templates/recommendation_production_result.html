{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-success text-center mb-4">🎯 Produits Recommandés</h2>

  <!-- ✅ TABLEAU DATATABLES -->
  <div class="table-responsive">
    {{ prediction | safe }}
  </div>

  <div class="text-center mt-4">
    <a href="/recommendation_production" class="btn btn-outline-primary">
      ⬅ Retour
    </a>
  </div>
</div>

<!-- ✅ STYLES & LIBS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<!-- ✅ Initialisation DataTables avec 5 produits par page -->
<script>
  $(document).ready(function () {
    $('table').DataTable({
      pageLength: 5,  // ✅ 5 PRODUITS PAR PAGE
      dom: 'Bfrtip',
      buttons: [
        {
          extend: 'csvHtml5',
          text: '📁 Export CSV',
          className: 'btn btn-sm btn-warning'
        },
        {
          extend: 'pdfHtml5',
          text: '🧾 Export PDF',
          className: 'btn btn-sm btn-danger',
          orientation: 'landscape',
          pageSize: 'A4',
          exportOptions: {
            columns: ':visible'
          }
        }
      ],
      language: {
        search: "🔍 Recherche:",
        lengthMenu: "Afficher _MENU_ entrées",
        info: "Affichage de _START_ à _END_ sur _TOTAL_ produits",
        paginate: {
          previous: "⬅",
          next: "➡"
        }
      }
    });
  });
</script>
{% endblock %}
