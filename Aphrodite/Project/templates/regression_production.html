{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">📈 Prédiction de la Quantité Utilisée - Production</h2>

    <form method="POST" action="/regression_production" class="card p-5 shadow-lg rounded-4 bg-light">
        <div class="mb-4">
            <label for="productFK" class="form-label">Product FK</label>
            <input type="number" class="form-control" id="productFK" name="productFK"
                   placeholder="🔢 Entrez le Product FK" required min="0" step="1">
        </div>

        <div class="mb-4">
            <label for="brandFK" class="form-label">Brand FK</label>
            <input type="number" class="form-control" id="brandFK" name="brandFK"
                   placeholder="🏷️ Entrez le Brand FK" required min="0" step="1">
        </div>

        <div class="mb-4">
            <label for="dosage" class="form-label">Dosage</label>
            <input type="number" class="form-control" id="dosage" name="dosage"
                   placeholder="⚖️ Entrez le Dosage" required min="0.01" step="any">
        </div>

        <div class="mb-4">
            <label for="production_duration_hours" class="form-label">Durée de Production (en heures)</label>
            <input type="number" class="form-control" id="production_duration_hours" name="production_duration_hours"
                   placeholder="⏱️ Entrez la durée de production" required min="0.01" step="any">
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                📊 Prédire la Quantité Utilisée
            </button>
        </div>
    </form>
</div>
{% endblock %}
