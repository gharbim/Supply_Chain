{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">📈 Prédiction avec modèle ARRIIMA</h2>

    <form method="POST" action="/predict_arriima" class="card p-5 shadow-lg rounded-4 bg-light">
        <div class="mb-4">
            <label for="input_value" class="form-label">Entrez le nombre de périodes à prédire :</label>
            <input type="number" class="form-control" id="input_value" name="input_value" placeholder="Ex: 3" required min="1">
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg shadow-sm">
                🔎 Prédire
            </button>
        </div>
    </form>

    {% if prediction %}
    <div class="card mt-5 shadow-sm">
        <div class="card-header bg-success text-white">
            📊 Résultats de la Prédiction
        </div>
        <div class="card-body p-4">
            <table class="table table-hover table-bordered">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Jour</th>
                        <th scope="col">Valeur prédite</th>
                    </tr>
                </thead>
                <tbody>
                    {% for value in prediction %}
                    <tr>
                        <td>Jour {{ loop.index }}</td>
                        <td>{{ value | round(2) }}</td>  {# arrondi à 2 décimales #}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
