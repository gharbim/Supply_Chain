{% extends "layout.html" %}
{% block content %}
<style>
  .preview-img, .result-img {
    margin-top: 20px;
    max-width: 200px;
    width: 500%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    object-fit: contain;
  }
</style>

<div class="container text-center">
  <h2 class="mb-4">✅ Résultat de la Classification</h2>

  <div class="card p-4 shadow-sm">
    <h4>Produit détecté :</h4>
    <span class="badge bg-primary fs-5">{{ prediction }}</span>

    <div class="mt-4">
      <img src="{{ url_for('static', filename='uploads/' + filename) }}" class="result-img">
    </div>

    <div class="mt-4">
      <a href="/cosmetics_predict" class="btn btn-outline-primary">🔄 Refaire une prédiction</a>
    </div>
  </div>
</div>

{% endblock %}
